<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Ticket — IT Helpdesk</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F0F4F8; color: #1a1a1a; font-size: 14px; }
  nav { background: #1B2A4A; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .nav-brand { color: #fff; font-weight: 700; font-size: 16px; }
  .nav-brand span { color: #60A5FA; }
  .nav-links a { color: #94A3B8; text-decoration: none; font-size: 13px; margin-left: 20px; }
  .nav-links a:hover { color: #fff; }
  main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 28px; border: 0.5px solid #E2E8F0; }
  .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
  .flash-success { background: #DCFCE7; color: #166534; }
  .flash-danger { background: #FEE2E2; color: #991B1B; }
  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    main { margin: 20px auto; }
    .card { padding: 20px; }
    .row { grid-template-columns: 1fr; gap: 0; }
  }
  h1 { font-size: 18px; font-weight: 700; color: #1B2A4A; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  input, select, textarea { width: 100%; border: 1px solid #E2E8F0; border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: inherit; color: #1a1a1a; background: #F8FAFC; outline: none; transition: border-color .15s; }
  input:focus, select:focus, textarea:focus { border-color: #2563B0; background: #fff; }
  textarea { min-height: 100px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-submit { background: #2563B0; color: #fff; border: none; border-radius: 6px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-submit:hover { background: #1D4ED8; }
  .btn-cancel { background: #F1F5F9; color: #64748B; border: none; border-radius: 6px; padding: 10px 22px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head>
<body>
<nav>
  <div class="nav-brand">IT <span>Helpdesk</span></div>
  <div class="nav-links">
    <a href="/">Dashboard</a>
  </div>
</nav>
<main>
  <div class="card">
    <h1>New Support Ticket</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="form-group">
        <label for="title">Title *</label>
        <input id="title" type="text" name="title" maxlength="120" required placeholder="Brief description of the issue">
      </div>
      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" name="description" maxlength="2000" required placeholder="What happened, when, which device or app, and any error message"></textarea>
      </div>
      <div class="row">
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option>Hardware</option>
            <option>Software</option>
            <option>Network</option>
            <option>Access</option>
            <option>Onboarding</option>
            <option>Email</option>
            <option>General</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Critical</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label for="requester">Requester *</label>
          <input id="requester" type="text" name="requester" maxlength="100" required placeholder="Full name or email">
        </div>
        <div class="form-group">
          <label for="assigned_to">Assign To</label>
          <input id="assigned_to" type="text" name="assigned_to" maxlength="100" placeholder="Technician name (optional)">
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn-submit">Create Ticket</button>
        <a href="/" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
